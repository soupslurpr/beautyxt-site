<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BeauTyXT social preview artwork</title>
  <style>
    * { box-sizing: border-box; }
    body { width: 1200px; height: 630px; margin: 0; padding: 68px 72px; display: grid; grid-template-columns: 1fr 320px; align-items: center; gap: 40px; background: #e0e9e3; color: #182c29; font-family: system-ui, sans-serif; }
    .name { margin: 0 0 32px; font-size: 28px; font-weight: 650; letter-spacing: -1px; }
    h1 { margin: 0; font-size: 90px; font-weight: 650; line-height: 1.02; letter-spacing: -5px; }
    h1 span { color: #006b63; }
    .description { margin: 30px 0 0; font-size: 22px; line-height: 1.6; color: #4c605b; }
    .address { margin: 22px 0 0; font-size: 17px; color: #006b63; }
    img { display: block; width: 288px; height: 288px; border-radius: 30%; }
  </style>
</head>
<body>
  <div><p class="name">BeauTyXT</p><h1>Read. Edit.<br><span>Share.</span></h1><p class="description">Plain text &amp; Markdown.<br>Made for Android.</p><p class="address">beautyxt.app</p></div>
  <img src="http://127.0.0.1:4173/assets/icon.webp" alt="BeauTyXT’s document and pencil icon">
</body>
</html>
