<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f8f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111a19" media="(prefers-color-scheme: dark)">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
{{robots}}
  <link rel="canonical" href="{{canonical}}">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/assets/icon.webp" type="image/webp" sizes="308x308">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/main.css">
  <link rel="license" href="/LICENSE">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BeauTyXT">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="https://beautyxt.app/opengraph.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="BeauTyXT. Read, edit, and share plain text and Markdown for Android.">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <nav class="navigation page-width" aria-label="Main navigation">
      <a class="wordmark" href="/"{{home_current}}>
        <img class="app-icon" src="/assets/icon.webp" width="44" height="44" alt="">
        <span>BeauTyXT</span>
      </a>
      <div class="nav-links">
        <a class="nav-link" href="/#features">Features</a>
        <a class="nav-link" href="/#privacy">Privacy</a>
        <a class="nav-link" href="https://github.com/soupslurpr/BeauTyXT">Source <span aria-hidden="true">↗</span></a>
      </div>
      <a class="button button-small nav-download" href="/#download">Download <span aria-hidden="true">↓</span></a>
    </nav>
  </header>
  <main id="main" tabindex="-1">
{{content}}
  </main>
  <footer class="site-footer page-width">
    <div class="footer-top">
      <div>
        <a class="wordmark" href="/">
          <img class="app-icon" src="/assets/icon.webp" width="40" height="40" alt="" loading="lazy">
          <span>BeauTyXT</span>
        </a>
        <p>Plain text. Markdown. Yours.</p>
      </div>
      <nav class="footer-links" aria-label="More about BeauTyXT">
        <a href="https://matrix.to/#/#beautyxt-space:matrix.org">Matrix</a>
        <a href="https://github.com/soupslurpr/BeauTyXT">App source</a>
        <a href="/contact/"{{contact_current}}>Contact</a>
        <a href="/LICENSE">License</a>
        <a href="/website-privacy-policy/">Website privacy</a>
      </nav>
    </div>
    <div class="footer-bottom">
      <a href="https://github.com/soupslurpr">© 2026 soupslurpr</a>
      <a href="https://github.com/soupslurpr/beautyxt-site">Website source <span aria-hidden="true">↗</span></a>
    </div>
  </footer>
</body>
</html>
